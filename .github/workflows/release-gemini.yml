name: Release Gemini extension

# Gemini CLI installs this repository's extension from its latest release, so a
# release here carries google/ as one archive with gemini-extension.json at its
# root. Run by hand from main after a google/ version bump.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check out the skills source
        uses: actions/checkout@v6
        with:
          repository: Sugra-Systems/sugra-api-skills
          ref: main
          fetch-depth: 0
          path: .skills-source
          persist-credentials: false
      - name: Check packages
        run: python scripts/check.py --source .skills-source
      - name: Build the archive
        run: python scripts/build_gemini_archive.py --source .skills-source
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c 'import json; print(json.load(open("google/gemini-extension.json"))["version"])')
          tag="gemini-v${version}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "FAIL release $tag exists; bump the version in google/gemini-extension.json and scripts/check.py"
            exit 1
          fi
          gh release create "$tag" "dist/sugra-api-gemini-${version}.zip" \
            --target "$GITHUB_SHA" \
            --title "Gemini CLI extension ${version}" \
            --notes "Sugra API Skills for Gemini CLI ${version}. Install: gemini extensions install https://github.com/Sugra-Systems/sugra-api-plugins" \
            --latest
